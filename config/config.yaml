# ============================================================================
# RNA-seq Pipeline Configuration
# ----------------------------------------------------------------------------
# All paths are relative to the Snakemake working directory (the project root
# inside the container: /pipeline). Override any value at runtime with:
#   snakemake --configfile path/to/custom.yaml
#   snakemake --config key=value
# ============================================================================

# ---------------------------------------------------------------------------
# Sample sheet (columns: sample_id[, condition]). Raw reads are expected at
# {data_dir}/{sample_id}{r1_suffix} and {data_dir}/{sample_id}{r2_suffix}.
# ---------------------------------------------------------------------------
samples_table: "config/samples.csv"

# ---------------------------------------------------------------------------
# Genome metadata (informational; used by downstream docs/logs)
# ---------------------------------------------------------------------------
genome:
  species: "Homo_sapiens"
  build: "GRCh38"
  release: "36"              # GENCODE release (matches gencode.v36.annotation.gtf)

# ---------------------------------------------------------------------------
# Input / output layout
# ---------------------------------------------------------------------------
paths:
  data_dir: "data"           # raw FASTQ files live here
  results_dir: "results"     # all pipeline outputs
  logs_dir: "logs"           # all log files
  ref_dir: "ref"             # reference data (mounted at runtime)

# FASTQ naming convention: {sample}{r1_suffix} / {sample}{r2_suffix}
samples:
  r1_suffix: "_R1_001.fastq.gz"
  r2_suffix: "_R2_001.fastq.gz"

# ---------------------------------------------------------------------------
# Reference files (paths resolved relative to paths.ref_dir unless absolute)
# ---------------------------------------------------------------------------
references:
  hisat2_index: "ref/ENSEMBL/genome"                      # HISAT2 index prefix
  gtf:         "ref/gencode.v36.annotation.gtf"           # Gene annotation (GTF, GENCODE chr-prefixed)
  bed:         "ref/gencode.v36.bed"                      # RSeQC 12-col BED (GENCODE, chr-prefixed)
  picard_jar:  "ref/picard.jar"                           # Picard Tools JAR
  salmon_index:       "ref/Salmon_index_Grch38"           # Standard Salmon index
  salmon_decoy_index: "ref/Salmon_index_decoy_Grch38"     # Decoy-aware Salmon index
  # Source FASTAs used to BUILD the indexes above when they are absent. If you bring
  # your own pre-built indexes, these are never read. genome_fasta builds the HISAT2
  # index and the Salmon decoys; transcriptome_fasta builds the Salmon indexes.
  genome_fasta:        "ref/genome.fa"                    # genome FASTA (HISAT2 build + Salmon decoys)
  transcriptome_fasta: "ref/transcripts.fa"               # transcriptome FASTA (Salmon build)

# ---------------------------------------------------------------------------
# Index building (used only when the indexes above are absent)
# ---------------------------------------------------------------------------
index:
  # false = plain genome HISAT2 index (~6 GB RAM to build); HISAT2 still finds
  # junctions de novo at run time. true = build with --ss/--exon extracted from the
  # GTF (better on annotated junctions, but ~160 GB RAM for a human genome).
  hisat2_splice_aware: false
  salmon_kmer: 31              # salmon index -k (min match length; 31 suits >=75 bp reads)
  # Restrict the genome to these chromosomes when BUILDING the HISAT2 index (reads then
  # align only to them). Names MUST match your genome FASTA (ENSEMBL: 1 2 ... X Y MT;
  # UCSC: chr1 ...). Empty [] = build the whole genome. Only affects the auto-built index.
  align_chroms: []

# ---------------------------------------------------------------------------
# Per-rule thread counts
# ---------------------------------------------------------------------------
threads:
  fastqc:          8
  fastp:           8
  hisat2:          20
  samtools:        20
  samtools_byname: 8
  featurecounts:   20
  multiqc:         2
  picard:          4
  qualimap_bamqc:  8
  qualimap_rnaseq: 8
  rseqc:           4
  salmon:          20

# ---------------------------------------------------------------------------
# Tool parameters
# ---------------------------------------------------------------------------
fastp:
  # Passed verbatim to fastp. Override for SE reads, custom adapter trimming, etc.
  extra: "--detect_adapter_for_pe -g -p"

hisat2:
  # Library/alignment params. Defaults tuned for stranded paired-end libraries.
  extra: "-q --phred33 -X 3000 -I 0 --no-discordant --no-mixed"

samtools_filter:
  # Filter flags applied before sort/index. 0x2 = proper pair, 0x100 = secondary.
  require_flags: "0x2"
  exclude_flags: "0x100"
  # Post-filter grep to keep only uniquely mapped reads (NH:i:1). Leave empty to skip.
  unique_tag: "NH:i:1"
  # Optional: after alignment, keep only reads on these chromosomes (names must match the
  # BAM/reference; ENSEMBL 1 2 ... X Y MT, UCSC chr1 ...). Empty [] = keep all chromosomes.
  keep_chroms: []

featurecounts:
  # -t feature type, -g attribute, -s strandedness (0 unstranded, 1 forward, 2 reverse)
  feature_type: "exon"
  attribute:    "gene_id"
  strandedness: 0
  # Extra flags (paired-end counting, multi-mapper inclusion, etc.)
  extra: "--countReadPairs -p -M"

qualimap:
  # JVM heap allocated to Qualimap; bump for large BAMs.
  java_mem: "20G"
  # Library protocol: strand-specific-forward | strand-specific-reverse | non-strand-specific
  protocol: "non-strand-specific"

salmon:
  # Library-type auto-detect ("A") or explicit ISR/ISF/etc.
  lib_type: "A"
  extra: "--validateMappings"

# ---------------------------------------------------------------------------
# Differential expression (opt-in stage: `snakemake deg_all`; R / DESeq2)
# ---------------------------------------------------------------------------
# DESeq2 over the featureCounts matrix, one contrast per non-reference level of the
# samples.csv `condition_col` (vs `reference`), plus GO/KEGG over-representation.
deg:
  condition_col: "condition"   # column in config/samples.csv holding the group labels
  reference: "control"         # reference (denominator) level of the contrast
  padj: 0.05                   # adjusted-p significance threshold
  lfc: 1.0                     # |log2FC| threshold for calling a gene significant
  top_genes: 30                # genes shown in the top-gene heatmap
  go_ont: "ALL"                # GO ontology: BP | MF | CC | ALL
  run_kegg: true               # also run KEGG over-representation (needs network at runtime)
  orgdb: "org.Hs.eg.db"        # Bioconductor annotation package (organism)
  kegg_organism: "hsa"         # KEGG organism code (hsa = human)

# Transcript-level differential expression (opt-in: det_all). DESeq2 over the Salmon
# per-transcript estimated-count (NumReads) matrix, using the SAME contrast as `deg`
# above (condition_col / reference / padj / lfc / top_genes are reused). Emits a
# transcript count matrix, a TPM matrix, DE tables, and plots per quant source.
# Transcript-level differential expression. Two implementations:
#   * transcript_de.smk (edgeR catchSalmon, DTE) — the correct, reported analysis.
#     Opt-in: txq_all (bootstrap quant) -> dte_all (DTE). Needs the r-transcript
#     env, so rebuild the container after adding it. >=3 replicates/group.
#   * det.smk (legacy NumReads -> DESeq2) — kept for continuity, writes to
#     results/transcript_de_naive/; does not control transcript-level FDR.
transcript_de:
  # ---- bootstrap quantification (T1: salmon_boot_quant) ----
  num_bootstraps: 100
  inference: "bootstrap"          # bootstrap (dte_all, default) | gibbs (swish)
  # No `libtype` key: Salmon inherits config["salmon"]["lib_type"] ("A").

  # ---- design ----
  covariates: []                  # extra samples.csv columns, e.g. ["batch"]

  # ---- DTE (T2: dte_catchsalmon) — the primary analysis ----
  dte_lfc: 1.0                    # glmTreat |log2FC| threshold; 0 = plain QL test
  emit_gene_simes: true           # gene-level Simes roll-up alongside transcript FDR

  # ---- DTU interpretation layer (T4, follow-up; env already provisioned) ----
  min_feature_expr: 10
  min_feature_prop: 0.10          # the filter that does most of the work
  min_gene_expr: 10
  dif_cutoff: 0.10                # |dIF| gate for the DTU annotation
  run_swish: null                 # null = auto-enable when min group n >= 5

  # ---- legacy det.smk (NumReads -> DESeq2; results/transcript_de_naive/) ----
  quant_sources: ["salmon_decoy"]  # decoy-aware only (non-decoy is strictly worse)
  min_count: 10
