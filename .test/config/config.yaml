# ============================================================================
# RNA-seq Pipeline Configuration
# ----------------------------------------------------------------------------
# All paths are relative to the Snakemake working directory (the project root
# inside the container: /pipeline). Override any value at runtime with:
#   snakemake --configfile path/to/custom.yaml
#   snakemake --config key=value
# ============================================================================

# ---------------------------------------------------------------------------
# Sample sheet (columns: sample_id[, condition]). Raw reads are expected at
# {data_dir}/{sample_id}{r1_suffix} and {data_dir}/{sample_id}{r2_suffix}.
# ---------------------------------------------------------------------------
samples_table: "config/samples.csv"

# ---------------------------------------------------------------------------
# Genome metadata (informational; used by downstream docs/logs)
# ---------------------------------------------------------------------------
genome:
  species: "Homo_sapiens"
  build: "GRCh38"
  release: "102"

# ---------------------------------------------------------------------------
# Input / output layout
# ---------------------------------------------------------------------------
paths:
  data_dir: "data"           # raw FASTQ files live here
  results_dir: "results"     # all pipeline outputs
  logs_dir: "logs"           # all log files
  ref_dir: "ref"             # reference data (mounted at runtime)

# FASTQ naming convention: {sample}{r1_suffix} / {sample}{r2_suffix}
samples:
  r1_suffix: "_R1_001.fastq.gz"
  r2_suffix: "_R2_001.fastq.gz"

# ---------------------------------------------------------------------------
# Reference files (paths resolved relative to paths.ref_dir unless absolute)
# ---------------------------------------------------------------------------
references:
  hisat2_index: "ref/ENSEMBL/genome"                      # HISAT2 index prefix
  gtf:         "ref/Homo_sapiens.GRCh38.102.gtf"          # Gene annotation (GTF)
  bed:         "ref/ENSEMBL_hg38.bed"                     # RSeQC 12-col BED
  picard_jar:  "ref/picard.jar"                           # Picard Tools JAR
  salmon_index:       "ref/Salmon_index_Grch38"           # Standard Salmon index
  salmon_decoy_index: "ref/Salmon_index_decoy_Grch38"     # Decoy-aware Salmon index

# ---------------------------------------------------------------------------
# Per-rule thread counts
# ---------------------------------------------------------------------------
threads:
  fastqc:          8
  fastp:           8
  hisat2:          20
  samtools:        20
  samtools_byname: 8
  featurecounts:   20
  multiqc:         2
  picard:          4
  qualimap_bamqc:  8
  qualimap_rnaseq: 8
  rseqc:           4
  salmon:          20

# ---------------------------------------------------------------------------
# Tool parameters
# ---------------------------------------------------------------------------
fastp:
  # Passed verbatim to fastp. Override for SE reads, custom adapter trimming, etc.
  extra: "--detect_adapter_for_pe -g -p"

hisat2:
  # Library/alignment params. Defaults tuned for stranded paired-end libraries.
  extra: "-q --phred33 -X 3000 -I 0 --no-discordant --no-mixed"

samtools_filter:
  # Filter flags applied before sort/index. 0x2 = proper pair, 0x100 = secondary.
  require_flags: "0x2"
  exclude_flags: "0x100"
  # Post-filter grep to keep only uniquely mapped reads (NH:i:1). Leave empty to skip.
  unique_tag: "NH:i:1"

featurecounts:
  # -t feature type, -g attribute, -s strandedness (0 unstranded, 1 forward, 2 reverse)
  feature_type: "exon"
  attribute:    "gene_id"
  strandedness: 0
  # Extra flags (paired-end counting, multi-mapper inclusion, etc.)
  extra: "--countReadPairs -p -M"

qualimap:
  # JVM heap allocated to Qualimap; bump for large BAMs.
  java_mem: "20G"
  # Library protocol: strand-specific-forward | strand-specific-reverse | non-strand-specific
  protocol: "non-strand-specific"

salmon:
  # Library-type auto-detect ("A") or explicit ISR/ISF/etc.
  lib_type: "A"
  extra: "--validateMappings"
