# Run the RNA-seq Snakemake workflow in a container.
#
#   docker compose build                                  # build (pre-bakes conda envs)
#   docker compose run --rm rnaseq --cores 8              # everything
#   docker compose run --rm rnaseq --cores 8 rna_all      # core stage only
#   docker compose run --rm rnaseq -n                     # dry run
#
# The whole project is mounted at /workflow; the pre-built envs live at
# /opt/wf-conda inside the image (outside the mount, so they are not hidden).

services:
  rnaseq:
    build:
      context: .
      dockerfile: Dockerfile
    image: rnaseq-pipeline:latest
    working_dir: /workflow
    volumes:
      - ./:/workflow
    # Write outputs as the host user (avoids root-owned results/). Export
    # DOCKER_UID/DOCKER_GID or edit these defaults as needed.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
    # The image ENTRYPOINT already sets `-s workflow/Snakefile --use-conda ...`,
    # so this only needs the cores (and an optional target). Override on the CLI.
    command: ["--cores", "8"]
