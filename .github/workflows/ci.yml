name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install snakemake pytest pyyaml jsonschema pandas
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Stub inputs
        # Empty placeholder reads + source FASTAs so the DAG resolves in a dry run
        # (no rule runs, so 0-byte files are fine). The repo ships empty index dirs,
        # so the index-build rules are scheduled and need genome_fasta/transcriptome_fasta.
        run: |
          mkdir -p data ref
          touch ref/genome.fa ref/transcripts.fa ref/gencode.v36.annotation.gtf
          python - <<'PY'
          import csv, pathlib
          for r in csv.DictReader(open("config/samples.csv")):
              s = r["sample_id"]
              for suf in ("_R1_001.fastq.gz", "_R2_001.fastq.gz"):
                  pathlib.Path(f"data/{s}{suf}").touch()
          PY
      - name: Dry run (DAG builds + config validates)
        run: snakemake -s workflow/Snakefile -n --cores 1
      - name: Dry run (opt-in deg_all stage)
        run: snakemake -s workflow/Snakefile -n --cores 1 deg_all
      - name: Dry run (opt-in det_all transcript stage)
        run: snakemake -s workflow/Snakefile -n --cores 1 det_all
      - name: Dry run (opt-in dte_all catchSalmon stage)
        run: snakemake -s workflow/Snakefile -n --cores 1 dte_all
      - name: Dry run (opt-in tx_report_all DTU+report stage)
        run: snakemake -s workflow/Snakefile -n --cores 1 tx_report_all
      - name: Lint (informational)
        continue-on-error: true
        run: snakemake -s workflow/Snakefile --lint
