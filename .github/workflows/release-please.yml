name: release-please

# Conventional-Commit-driven versioning + releases. On push to main, opens/updates
# a release PR that bumps the version and CHANGELOG.md. Merging it tags + releases.
#
# One-time repo setting: Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" → enabled.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
